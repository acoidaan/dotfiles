# MONITORES
monitor=DP-2,1920x1080@144,0x0,1
monitor=DP-1,1920x1080@165,1920x0,1

workspace=1,monitor:DP-1,default:true
wokspace=2,monitor:DP-2,default:true

# PROGRAMAS
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

# INICIO
exec-once = waybar
exec-once = mako
exec-once = nm-applet
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hyprpaper

# Historial del portapapeles
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# OSD de volumen/brillo
exec-once = swayosd-server

# Bloqueo, apagado de pantalla y suspensión automáticos
exec-once = hypridle >/dev/null 2>&1

# TECLADO Y RATON
input {
	kb_layout = es
	follow_mouse = 1

	touchpad {
		natural_scroll = false
	}
}

# ASPECTO
general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2

	col.active_border = rgb(f28fb8) rgb(fff6d6) 45deg
	col.inactive_border = rgba(555555aa)

	layout = dwindle
}

decoration {
	rounding = 10

	blur {
		enabled = true
		size = 5
		passes = 2
	}

	shadow {
		enabled = true
		range = 12
		render_power = 3
		color = rgba(00000088)
	}
}

animations {
    enabled = true

    bezier = smooth, 0.25, 0.9, 0.25, 1.0
    bezier = snappy, 0.2, 0.8, 0.2, 1.0

    animation = windows, 1, 4, smooth
    animation = windowsOut, 1, 3, snappy, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 4, smooth, slide
}

# ATAJOS
$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod SHIFT, M, exit
bind = $mainMod, F, fullscreen

# MOVER FOCO
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# WORKSPACES
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# RATON + SUPER PARA MOVER/REDIMENSIONAR
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# =========================
# MULTIMEDIA / G915 TKL
# =========================

# Volumen
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Volumen G915 + OSD
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

# Impr Pant → seleccionar zona, guardar Y copiar
bind = , Print, exec, sh -c 'file="$HOME/Pictures/Screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"; grim -g "$(slurp)" "$file" && wl-copy < "$file"'

# Shift + Impr Pant → pantalla completa, guardar Y copiar
bind = SHIFT, Print, exec, sh -c 'file="$HOME/Pictures/Screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"; grim "$file" && wl-copy < "$file"'

# "Minimizar" ventana al scratchpad
bind = $mainMod, D, movetoworkspace, special:minimized

# Mostrar / ocultar ventanas minimizadas
bind = $mainMod, S, togglespecialworkspace, minimized

# Bloquear PC
bind = $mainMod, L, exec, hyprlock

# Menú de energía
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/powermenu.sh

# Historial del portapapeles
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy && sleep 0.2 && wtype -M ctrl -P v -m ctrl
