# FONDO
background {
    monitor =
    path = ~/Pictures/wallpaper.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
}

# HORA
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(255, 246, 214)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# FECHA
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgb(242, 143, 184)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}

# USUARIO
label {
    monitor =
    text = acoidan@cachyos
    color = rgb(248, 200, 220)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -65
    halign = center
    valign = center
}

# CONTRASEÑA
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1

    outer_color = rgb(242, 143, 184)
    inner_color = rgba(12, 12, 12, 0.85)
    font_color = rgb(232, 232, 232)

    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Password...</span>

    dots_spacing = 0.25
    dots_center = true

    rounding = 10

    position = 0, -125
    halign = center
    valign = center
}
